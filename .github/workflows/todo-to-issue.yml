name: "Convert TODOs to Issues"

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "TODO to Issue"
        uses: alstr/todo-to-issue-action@v5
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSERT_ISSUE_URLS: "true"
          CLOSE_ISSUES: "true"